<div class="container-fluid px-0">
  <nav aria-label="Breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/fabrics">Fabrics</a></li>
      <li class="breadcrumb-item active">{{ editMode ? 'Edit fabric' : 'Add fabric' }}</li>
    </ol>
  </nav>
  <h1 class="h2 mb-4">{{ editMode ? 'Edit fabric' : 'Add fabric' }}</h1>
  @if (loading()) {
    <div class="card border-0 shadow-sm">
      <div class="card-body text-center py-5">
        <span class="spinner-border text-primary"></span>
      </div>
    </div>
  } @else {
    @if (error(); as message) {
      <div class="alert alert-danger" role="alert">{{ message }}</div>
    }
    <form [formGroup]="form" (ngSubmit)="submit()" class="card border-0 shadow-sm">
      <div class="card-body p-3 p-md-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Name *</label
            ><input id="name" class="form-control" formControlName="name" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="type">Type *</label
            ><select id="type" class="form-select" formControlName="type">
              <option [ngValue]="null">Select type</option>
              @for (type of types; track type) {
                <option [ngValue]="type">{{ label(type) }}</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="color">Color *</label
            ><input id="color" class="form-control" formControlName="color" />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="quantity">Quantity *</label
            ><input
              id="quantity"
              class="form-control"
              type="number"
              min="0"
              step="0.001"
              inputmode="decimal"
              formControlName="quantity"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="unit">Unit *</label
            ><select id="unit" class="form-select" formControlName="unit">
              <option [ngValue]="null">Select unit</option>
              @for (unit of units; track unit) {
                <option [ngValue]="unit">{{ label(unit) }}</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="price">Price per unit *</label
            ><input
              id="price"
              class="form-control"
              type="number"
              min="0"
              step="0.01"
              inputmode="decimal"
              formControlName="pricePerUnit"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="supplier">Supplier</label
            ><input id="supplier" class="form-control" formControlName="supplier" />
          </div>
          <div class="col-12">
            <label class="form-label" for="description">Description</label
            ><textarea
              id="description"
              class="form-control"
              rows="4"
              formControlName="description"
            ></textarea>
          </div>
          <div class="col-12 form-check ms-2">
            <input
              id="active"
              class="form-check-input"
              type="checkbox"
              formControlName="isActive"
            /><label class="form-check-label" for="active">Active</label>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 border-top mt-4 pt-4">
          <button
            class="btn btn-outline-secondary"
            type="button"
            [disabled]="submitting()"
            (click)="cancel()"
          >
            Cancel</button
          ><button class="btn btn-primary" type="submit" [disabled]="submitting()">
            {{ submitting() ? 'Saving…' : 'Save fabric' }}
          </button>
        </div>
      </div>
    </form>
  }
</div>
