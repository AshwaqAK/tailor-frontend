<main class="login-page d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <section class="card border-0 shadow-lg" aria-labelledby="login-title">
          <div class="card-body p-4 p-md-5">
            <div class="mb-4 text-center">
              <p class="brand-mark mx-auto mb-3" aria-hidden="true">T</p>
              <h1 id="login-title" class="h3 mb-2">Welcome back</h1>
              <p class="text-body-secondary mb-0">Sign in to manage your tailoring business.</p>
            </div>

            @if (errorMessage(); as message) {
              <div class="alert alert-danger" role="alert">{{ message }}</div>
            }

            <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
              <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input
                  id="email"
                  class="form-control"
                  [class.is-invalid]="
                    loginForm.controls.email.touched && loginForm.controls.email.invalid
                  "
                  type="email"
                  formControlName="email"
                  autocomplete="username"
                />
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>

              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <input
                    id="password"
                    class="form-control"
                    [class.is-invalid]="
                      loginForm.controls.password.touched && loginForm.controls.password.invalid
                    "
                    [type]="passwordVisible() ? 'text' : 'password'"
                    formControlName="password"
                    autocomplete="current-password"
                  />
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
                    (click)="passwordVisible.set(!passwordVisible())"
                  >
                    {{ passwordVisible() ? 'Hide' : 'Show' }}
                  </button>
                  <div class="invalid-feedback">Password is required.</div>
                </div>
              </div>

              <button class="btn btn-primary w-100" type="submit" [disabled]="submitting()">
                {{ submitting() ? 'Signing in…' : 'Sign in' }}
              </button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
