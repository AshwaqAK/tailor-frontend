<div class="container-fluid px-0">

    <div class="card-body py-3">

        <a
          class="btn btn-sm btn-outline-secondary"
          routerLink="orders"

          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-clipboard-data me-1" aria-hidden="true"></i>
          <span>Orders</span>
        </a>
        <a
          class="btn btn-sm btn-outline-secondary"

          <span>Payments</span>
        </a>
        <a
          class="btn btn-sm btn-outline-secondary"
          routerLink="customers"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"

          <i class="bi bi-people me-1" aria-hidden="true"></i>
          <span>Customers</span>
        </a>
        <a
          class="btn btn-sm btn-outline-secondary"
          routerLink="appointments"

        >

          <span>Appointments</span>
        </a>
        <a
          class="btn btn-sm btn-outline-secondary"
          routerLink="fabrics"

          <i class="bi bi-scissors me-1" aria-hidden="true"></i>

          class="btn btn-sm btn-outline-secondary"
          routerLink="fabric-sales"

          [routerLinkActiveOptions]="{ exact: true }"

          <i class="bi bi-cart3 me-1" aria-hidden="true"></i>
          <span>Fabric sales</span>
        </a>
        <a
          class="btn btn-sm btn-outline-secondary"
          routerLink="service-usage"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="bi bi-tools me-1" aria-hidden="true"></i>
          <span>Service usage</span>
        </a>
      </div>
    </div>
  </nav>

  <router-outlet />
